events {
    worker_connections 2048;
}

http {
    limit_req_zone $binary_remote_addr zone=global_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=2r/s;

    limit_req_status 429;

    # Allowlist CORS 
    map $http_origin $cors_origin {
        default                                "";
        "~^https?://localhost(:[0-9]+)?$"      $http_origin;
        "~^https?://127\.0\.0\.1(:[0-9]+)?$"   $http_origin;
    }

    server {
        listen 80;
        limit_req zone=global_limit burst=50 nodelay;

        # Résolution DNS dynamique via le DNS interne Docker : les proxy_pass
        # passent par des variables pour re-résoudre les noms à l'exécution
        # (load-balancing des replicas, failover, démarrage différé des services).
        resolver 127.0.0.11 valid=10s ipv6=off;

        # Validation JWT interne (auth_request du front)
        location /authenticate {
            internal;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Authorization $http_authorization;
            set $svc_auth service-auth;
            proxy_pass http://$svc_auth:3000/api/v1/auth/validate;
            proxy_connect_timeout 2s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        # Ressources statiques et pages publiques du front
        location /_next/ {
            set $svc_front front;
            proxy_pass http://$svc_front:3000$request_uri;
            proxy_set_header Host $host;
        }

        location = /favicon.ico {
            set $svc_front front;
            proxy_pass http://$svc_front:3000/favicon.ico;
            proxy_set_header Host $host;
        }

        location = /login {
            set $svc_front front;
            proxy_pass http://$svc_front:3000/login;
            proxy_set_header Host $host;
        }

        location = /register {
            set $svc_front front;
            proxy_pass http://$svc_front:3000/register;
            proxy_set_header Host $host;
        }

        location = /401 {
            set $svc_front front;
            proxy_pass http://$svc_front:3000/401;
            proxy_set_header Host $host;
        }

        location = /403 {
            set $svc_front front;
            proxy_pass http://$svc_front:3000/403;
            proxy_set_header Host $host;
        }

        location = /404 {
            set $svc_front front;
            proxy_pass http://$svc_front:3000/404;
            proxy_set_header Host $host;
        }

        location = /429 {
            set $svc_front front;
            proxy_pass http://$svc_front:3000/429;
            proxy_set_header Host $host;
        }

        location = /500 {
            set $svc_front front;
            proxy_pass http://$svc_front:3000/500;
            proxy_set_header Host $host;
        }

        # Endpoints Auth : rate-limiting renforcé sur login/register
        location = /api/v1/auth/login {
            include /etc/nginx/cors.conf;
            limit_req zone=auth_limit burst=5 nodelay;
            error_page 429 = @api_rate_limited;
            set $svc_auth service-auth;
            proxy_pass http://$svc_auth:3000/api/v1/auth/login;
            proxy_set_header Host $host;
        }

        location = /api/v1/auth/register {
            include /etc/nginx/cors.conf;
            limit_req zone=auth_limit burst=3 nodelay;
            error_page 429 = @api_rate_limited;
            set $svc_auth service-auth;
            proxy_pass http://$svc_auth:3000/api/v1/auth/register;
            proxy_set_header Host $host;
        }

        location = /api/v1/auth/logout {
            include /etc/nginx/cors.conf;
            set $svc_auth service-auth;
            proxy_pass http://$svc_auth:3000/api/v1/auth/logout;
            proxy_set_header Host $host;
        }

        # Autres routes Auth (validate, roles, api-docs…)
        location /api/v1/auth/ {
            include /etc/nginx/cors.conf;
            set $svc_auth service-auth;
            proxy_pass http://$svc_auth:3000$request_uri;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        # Endpoints API : permissions vérifiées par chaque service via le JWT
        location /api/v1/user {
            include /etc/nginx/cors.conf;
            set $svc_user service-user;
            proxy_pass http://$svc_user:3000$request_uri;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        location /api/v1/post {
            include /etc/nginx/cors.conf;
            set $svc_post service-post;
            proxy_pass http://$svc_post:3000$request_uri;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        # Uploads images et vidéos courtes
        location /api/v1/media {
            include /etc/nginx/cors.conf;
            client_max_body_size 55m;
            set $svc_media service-media;
            proxy_pass http://$svc_media:3000$request_uri;
            proxy_set_header Host $host;
        }

        location /api/v1/notifications {
            include /etc/nginx/cors.conf;
            set $svc_notif service-notification;
            proxy_pass http://$svc_notif:3000$request_uri;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        # WebSocket messages : auth gérée au handshake socket.io
        location /api/v1/message/socket.io {
            set $svc_message service-message;
            proxy_pass http://$svc_message:3000$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # WebSocket notifications : auth gérée au handshake socket.io
        location /socket.io/ {
            set $svc_notif service-notification;
            proxy_pass http://$svc_notif:3000$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location /api/v1/message {
            include /etc/nginx/cors.conf;
            set $svc_message service-message;
            proxy_pass http://$svc_message:3000$request_uri;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        # Front protégé par validation JWT (redirige vers /login sinon)
        location / {
            auth_request /authenticate;
            error_page 401 = @redirect_login;
            error_page 403 /403;
            error_page 429 /429;

            set $svc_front front;
            proxy_pass http://$svc_front:3000$request_uri;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location @redirect_login {
            return 302 /login;
        }

        location @api_rate_limited {
            default_type application/json;
            return 429 '{"message":"Too many requests"}';
        }
    }
}
