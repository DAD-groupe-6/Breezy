events {
    worker_connections 2048;
}

http {
    limit_req_zone $binary_remote_addr zone=global_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=2r/s;

    limit_req_status 429;

    server {
        listen 80;
        limit_req zone=global_limit burst=50 nodelay;

        # --------------------------------------------------
        # VALIDATION JWT INTERNE (auth_request du front)
        # Transmet Cookie ET Authorization pour supporter les deux modes.
        # --------------------------------------------------
        location /authenticate {
            internal;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Authorization $http_authorization;
            proxy_pass http://service-auth:3000/api/v1/auth/validate;
        }

        # --------------------------------------------------
        # RESSOURCES STATIQUES ET PAGES PUBLIQUES FRONT
        # --------------------------------------------------
        location /_next/ {
            proxy_pass http://front:3000/_next/;
            proxy_set_header Host $host;
        }

        location = /favicon.ico {
            proxy_pass http://front:3000/favicon.ico;
            proxy_set_header Host $host;
        }

        location = /login {
            proxy_pass http://front:3000/login;
            proxy_set_header Host $host;
        }

        location = /register {
            proxy_pass http://front:3000/register;
            proxy_set_header Host $host;
        }

        location = /401 {
            proxy_pass http://front:3000/401;
            proxy_set_header Host $host;
        }

        location = /403 {
            proxy_pass http://front:3000/403;
            proxy_set_header Host $host;
        }

        location = /404 {
            proxy_pass http://front:3000/404;
            proxy_set_header Host $host;
        }

        location = /429 {
            proxy_pass http://front:3000/429;
            proxy_set_header Host $host;
        }

        location = /500 {
            proxy_pass http://front:3000/500;
            proxy_set_header Host $host;
        }

        # --------------------------------------------------
        # ENDPOINTS AUTH — rate-limiting sur login/register
        # Les autres routes /api/v1/auth/* sont capturées par
        # le bloc préfixe ci-dessous (validate, roles, api-docs…).
        # --------------------------------------------------
        location = /api/v1/auth/login {
            limit_req zone=auth_limit burst=5 nodelay;
            error_page 429 = @api_rate_limited;
            proxy_pass http://service-auth:3000/api/v1/auth/login;
            proxy_set_header Host $host;
        }

        location = /api/v1/auth/register {
            limit_req zone=auth_limit burst=3 nodelay;
            error_page 429 = @api_rate_limited;
            proxy_pass http://service-auth:3000/api/v1/auth/register;
            proxy_set_header Host $host;
        }

        location = /api/v1/auth/logout {
            proxy_pass http://service-auth:3000/api/v1/auth/logout;
            proxy_set_header Host $host;
        }

        # Toutes les autres routes Auth (validate, roles, api-docs…)
        location /api/v1/auth/ {
            proxy_pass http://service-auth:3000;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        # --------------------------------------------------
        # ENDPOINTS API — permissions gérées par chaque service
        # Authorization transmis explicitement pour que les
        # middlewares des services puissent vérifier le JWT.
        # --------------------------------------------------
        location /api/v1/user {
            proxy_pass http://service-user:3000;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        location /api/v1/post {
            proxy_pass http://service-post:3000;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        # --------------------------------------------------
        # FRONT — protégé par validation JWT Nginx
        # Redirige vers /login si le token est absent ou invalide.
        # --------------------------------------------------
        location / {
            auth_request /authenticate;
            error_page 401 = @redirect_login;
            error_page 403 /403;
            error_page 429 /429;

            proxy_pass http://front:3000;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location @redirect_login {
            return 302 /login;
        }

        location @api_rate_limited {
            default_type application/json;
            return 429 '{"message":"Too many requests"}';
        }
    }
}
