events {
    worker_connections 2048;
}

http {
    limit_req_zone $binary_remote_addr zone=global_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=2r/s;

    limit_req_status 429;

    server {
        listen 80;
        limit_req zone=global_limit burst=50 nodelay;

        # --------------------------------------------------
        # RÉSOLUTION DNS DYNAMIQUE
        # 127.0.0.11 = DNS interne de Docker. En passant les proxy_pass par
        # une variable, Nginx re-résout les noms à l'exécution (toutes les 10s)
        # au lieu de figer l'IP au démarrage. Indispensable pour :
        #   - load-balancer les replicas (docker compose --scale)
        #   - basculer sur un replica sain si un autre tombe
        #   - démarrer même si un service n'est pas encore up
        # --------------------------------------------------
        resolver 127.0.0.11 valid=10s ipv6=off;

        # --------------------------------------------------
        # VALIDATION JWT INTERNE (auth_request du front)
        # Transmet Cookie ET Authorization pour supporter les deux modes.
        # --------------------------------------------------
        location /authenticate {
            internal;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Authorization $http_authorization;
            set $svc_auth service-auth;
            proxy_pass http://$svc_auth:3000/api/v1/auth/validate;
            # Failover rapide : si un replica auth est mort/lent, on bascule sur
            # un autre au lieu de renvoyer 502 sur toutes les pages du front.
            proxy_connect_timeout 2s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        # --------------------------------------------------
        # RESSOURCES STATIQUES ET PAGES PUBLIQUES FRONT
        # --------------------------------------------------
        location /_next/ {
            set $svc_front front;
            proxy_pass http://$svc_front:3000$request_uri;
            proxy_set_header Host $host;
        }

        location = /favicon.ico {
            set $svc_front front;
            proxy_pass http://$svc_front:3000/favicon.ico;
            proxy_set_header Host $host;
        }

        location = /login {
            set $svc_front front;
            proxy_pass http://$svc_front:3000/login;
            proxy_set_header Host $host;
        }

        location = /register {
            set $svc_front front;
            proxy_pass http://$svc_front:3000/register;
            proxy_set_header Host $host;
        }

        location = /401 {
            set $svc_front front;
            proxy_pass http://$svc_front:3000/401;
            proxy_set_header Host $host;
        }

        location = /403 {
            set $svc_front front;
            proxy_pass http://$svc_front:3000/403;
            proxy_set_header Host $host;
        }

        location = /404 {
            set $svc_front front;
            proxy_pass http://$svc_front:3000/404;
            proxy_set_header Host $host;
        }

        location = /429 {
            set $svc_front front;
            proxy_pass http://$svc_front:3000/429;
            proxy_set_header Host $host;
        }

        location = /500 {
            set $svc_front front;
            proxy_pass http://$svc_front:3000/500;
            proxy_set_header Host $host;
        }

        # --------------------------------------------------
        # ENDPOINTS AUTH — rate-limiting sur login/register
        # Les autres routes /api/v1/auth/* sont capturées par
        # le bloc préfixe ci-dessous (validate, roles, api-docs…).
        # --------------------------------------------------
        location = /api/v1/auth/login {
            limit_req zone=auth_limit burst=5 nodelay;
            error_page 429 = @api_rate_limited;
            set $svc_auth service-auth;
            proxy_pass http://$svc_auth:3000/api/v1/auth/login;
            proxy_set_header Host $host;
        }

        location = /api/v1/auth/register {
            limit_req zone=auth_limit burst=3 nodelay;
            error_page 429 = @api_rate_limited;
            set $svc_auth service-auth;
            proxy_pass http://$svc_auth:3000/api/v1/auth/register;
            proxy_set_header Host $host;
        }

        location = /api/v1/auth/logout {
            set $svc_auth service-auth;
            proxy_pass http://$svc_auth:3000/api/v1/auth/logout;
            proxy_set_header Host $host;
        }

        # Toutes les autres routes Auth (validate, roles, api-docs…)
        location /api/v1/auth/ {
            set $svc_auth service-auth;
            proxy_pass http://$svc_auth:3000$request_uri;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        # --------------------------------------------------
        # ENDPOINTS API — permissions gérées par chaque service
        # Authorization transmis explicitement pour que les
        # middlewares des services puissent vérifier le JWT.
        # --------------------------------------------------
        location /api/v1/user {
            set $svc_user service-user;
            proxy_pass http://$svc_user:3000$request_uri;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        location /api/v1/post {
            set $svc_post service-post;
            proxy_pass http://$svc_post:3000$request_uri;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        location /api/v1/media {
            # Autorise les uploads d'images et de vidéos courtes
            client_max_body_size 55m;
            set $svc_media service-media;
            proxy_pass http://$svc_media:3000$request_uri;
            proxy_set_header Host $host;
        }

        location /api/v1/notifications {
            set $svc_notif service-notification;
            proxy_pass http://$svc_notif:3000$request_uri;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        # WebSocket socket.io message — auth gérée côté socket.io (handshake token)
        location /api/v1/message/socket.io {
            set $svc_message service-message;
            proxy_pass http://$svc_message:3000$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # --------------------------------------------------
        # WEBSOCKET — temps réel des notifications (socket.io)
        # Auth via le JWT du handshake (pas de auth_request ici).
        # --------------------------------------------------
        location /socket.io/ {
            set $svc_notif service-notification;
            proxy_pass http://$svc_notif:3000$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location /api/v1/message {
            set $svc_message service-message;
            proxy_pass http://$svc_message:3000$request_uri;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        # --------------------------------------------------
        # FRONT — protégé par validation JWT Nginx
        # Redirige vers /login si le token est absent ou invalide.
        # --------------------------------------------------
        location / {
            auth_request /authenticate;
            error_page 401 = @redirect_login;
            error_page 403 /403;
            error_page 429 /429;

            set $svc_front front;
            proxy_pass http://$svc_front:3000$request_uri;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location @redirect_login {
            return 302 /login;
        }

        location @api_rate_limited {
            default_type application/json;
            return 429 '{"message":"Too many requests"}';
        }
    }
}
