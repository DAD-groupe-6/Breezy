events { worker_connections 1024; }

http {
    server {
        listen 80;

        location /authenticate {
            internal;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            
            # Transmet le cookie au service Auth
            proxy_set_header Cookie $http_cookie;
            proxy_pass http://service-auth:3000/api/v1/auth/validate;
        }

        # ---------------------------------------------
        # Assets Next.js — toujours publics
        # (nécessaires pour que /login se charge)
        # ---------------------------------------------
        location /_next/ {
            proxy_pass http://front:3000/_next/;
            proxy_set_header Host $host;
        }

        location = /favicon.ico {
            proxy_pass http://front:3000/favicon.ico;
            proxy_set_header Host $host;
        }

        # ---------------------------------------------
        # Pages frontend publiques
        # ---------------------------------------------
        location = /login {
            proxy_pass http://front:3000/login;
            proxy_set_header Host $host;
        }

        location = /register {
            proxy_pass http://front:3000/register;
            proxy_set_header Host $host;
        }

        # ---------------------------------------------
        # Endpoints Auth publics
        # ---------------------------------------------
        location = /api/v1/auth/login {
            proxy_pass http://service-auth:3000/api/v1/auth/login;
            proxy_set_header Host $host;
        }

        location = /api/v1/auth/register {
            proxy_pass http://service-auth:3000/api/v1/auth/register;
            proxy_set_header Host $host;
        }

        location = /api/v1/auth/logout {
            proxy_pass http://service-auth:3000/api/v1/auth/logout;
            proxy_set_header Host $host;
        }

        # ---------------------------------------------
        # Pages frontend protégées
        # (redirect /login si cookie absent ou invalide)
        # ---------------------------------------------
        location / {
            auth_request /authenticate;
            error_page 401 = @redirect_login;

            proxy_pass http://front:3000;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location @redirect_login {
            return 302 /login;
        }
    }
}
