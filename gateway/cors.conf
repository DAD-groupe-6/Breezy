# Politique CORS centralisée de l'API Breezy.
#
# Une origine non autorisée ne reçoit donc aucun en-tête Access-Control-* et est bloquée par le navigateur.
# Cette politique ne sert qu'aux clients tiers explicitement autorisés (durcissement).


if ($request_method = OPTIONS) {
    add_header Access-Control-Allow-Origin      $cors_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers     "Authorization, Content-Type" always;
    add_header Access-Control-Max-Age           86400 always;
    add_header Vary                             "Origin" always;
    return 204;
}

add_header Access-Control-Allow-Origin      $cors_origin always;
add_header Access-Control-Allow-Credentials "true" always;
add_header Vary                             "Origin" always;
