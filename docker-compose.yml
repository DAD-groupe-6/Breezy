services:
  # --- LA GATEWAY ---
  gateway:
    build:
      context: ./gateway
    ports:
      - "80:80"
    depends_on:
      - front
      - service-auth
      - service-post
      - service-user

  # --- LES BASES DE DONNÉES ---
  db-auth:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: auth_db
    volumes:
      - pg_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d auth_db"]
      interval: 3s
      timeout: 3s
      retries: 10

  db-user:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: user_db
    volumes:
      - pg_user_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d user_db"]
      interval: 3s
      timeout: 3s
      retries: 10

  db-post:
    image: mongo:latest
    volumes:
      - mongo_post_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.runCommand({ ping: 1 }).ok' | mongosh mongodb://localhost:27017/post_db --quiet"]
      interval: 5s
      timeout: 5s
      retries: 12

  # --- LE FRONT ---
  front:
    build:
      context: ./front

  # --- LES MICROSERVICES ---
  service-auth:
    build:
      context: ./Services/Auth
    environment:
      - NODE_ENV=dev
      - API_PORT=3000
      - DB_HOST=db-auth
      - DB_PORT=5432
      - DB_USER=admin
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=auth_db
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - SALT_ROUNDS=12
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET}
    depends_on:
      db-auth:
        condition: service_healthy

  service-user:
    build:
      context: ./Services/User
    environment:
      - DB_HOST=db-user
      - DB_USER=admin
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=user_db
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET}
    depends_on:
      db-user:
        condition: service_healthy

  service-post:
    build:
      context: ./Services/Post
    environment:
      - API_PORT=3000
      - MONGO_URI=mongodb://db-post:27017/post_db
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET}
    depends_on:
      db-post:
        condition: service_healthy

volumes:
  pg_auth_data:
  pg_user_data:
  mongo_post_data: